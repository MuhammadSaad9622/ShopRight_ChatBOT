# Render Blueprint: use Docker so Python 3.11 is fixed (avoids Python 3.14 / pydantic build errors)
services:
  - type: web
    name: support-agent-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: OPENAI_API_KEY
        sync: false
